{% extends "scheduler/base.html" %}

{% block title %}Sign In &middot; DC Gadgets{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
    <div style="text-align: center; margin-bottom: 28px;">
        <div class="brand-icon" style="width: 48px; height: 48px; font-size: 24px; margin: 0 auto 16px auto;">
            <i data-lucide="lock"></i>
        </div>
        <h1 class="section-title" style="font-size: 30px;">Welcome Back</h1>
        <p class="section-subtitle">Sign in to manage your tech bookings and profile.</p>
    </div>

    <div class="calculator-box" style="background: var(--bg-surface);">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="input-field" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="input-field" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                <i data-lucide="log-in"></i> Login
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--secondary); font-weight: 700;">Create one now</a>
        </div>
    </div>
</div>
{% endblock %}
